# Render Blueprint for the IndSolUSA CRM.
# In Render: New + -> Blueprint -> pick this repository. Render asks for the values marked sync: false.
services:
  - type: web
    name: indsolusa-crm
    runtime: node
    plan: starter # paid since 2026-11-10: no sleep, SOLU runs its own background work (keep in sync with Render, or a Blueprint sync could downgrade it)
    region: virginia # keep close to the Neon database (AWS US East 1)
    # Each deploy applies pending database migrations and makes sure the admin user exists.
    buildCommand: npm install && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/health # no database, no login: a cheap liveness check
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL # Neon connection string
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: MAIL_FROM
        value: sales@indsolusa.com
      - key: GRAPH_TENANT_ID
        value: 1485cd10-53c3-47e1-b2c2-6a5c5ab82d16
      - key: GRAPH_CLIENT_ID
        value: 8729883e-0014-48da-901f-72902623318a
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: sales@indsolusa.com
      - key: SEED_ADMIN_PASSWORD # only used the first time, to create the admin login
        sync: false
      - key: ANTHROPIC_API_KEY # Claude API (photo search); without it the AI features stay off
        sync: false
      - key: AI_MONTHLY_CAP_USD # AI stops for the month once this much was spent
        value: "20"
      - key: MOUSER_API_KEY # Mouser Search API (free, mouser.com/api-hub); optional
        sync: false
      - key: DIGIKEY_CLIENT_ID # Digi-Key Product Information v4 (free app at developer.digikey.com); optional
        sync: false
      - key: DIGIKEY_CLIENT_SECRET
        sync: false
